filebeat.inputs:
  - type: filestream
    id: nginx-access
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      service: nginx
    fields_under_root: true
    harvester_buffer_size: 16384
    max_bytes: 1048576
    close_inactive: 1m
    scan_frequency: 1s

  - type: filestream
    id: nginx-error
    enabled: true
    paths:
      - /var/log/nginx/error.log
    fields:
      service: nginx
    fields_under_root: true
    harvester_buffer_size: 16384
    max_bytes: 1048576

  - type: filestream
    id: ssh-auth
    enabled: true
    paths:
      - /var/log/ssh/auth.log
    fields:
      service: ssh
    fields_under_root: true
    harvester_buffer_size: 16384
    max_bytes: 1048576
    parsers:
      - multiline:
          type: pattern
          pattern: '^\{'
          negate: true
          match: after

  - type: filestream
    id: syslog-linux
    enabled: true
    paths:
      - /var/log/syslog/linux.log
    fields:
      service: syslog
    fields_under_root: true
    harvester_buffer_size: 16384
    max_bytes: 1048576

  - type: filestream
    id: app-requests
    enabled: true
    paths:
      - /var/log/app/requests.log
    fields:
      service: app
    fields_under_root: true
    harvester_buffer_size: 16384
    max_bytes: 1048576
    parsers:
      - multiline:
          type: pattern
          pattern: '^\{'
          negate: true
          match: after
          max_lines: 100
          timeout: 5s

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~

output.logstash:
  hosts: ["logstash:5044"]
  bulk_max_size: 2048
  compression_level: 3
  worker: 2

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  rotateeverybytes: 10485760
