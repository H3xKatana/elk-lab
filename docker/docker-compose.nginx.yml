version: '3.8'

services:
  nginx-lb:
    image: nginx:1.25-alpine
    container_name: nginx-loadbalancer
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./nginx-logs:/var/log/nginx
    ports:
      - "80:80"
    networks:
      - elk-network
    restart: unless-stopped

  checkout-backend:
    image: nginx:1.25-alpine
    container_name: checkout-service
    volumes:
      - ./html/checkout.html:/usr/share/nginx/html/index.html:ro
    networks:
      - elk-network
    restart: unless-stopped

  product-backend:
    image: nginx:1.25-alpine
    container_name: product-service
    volumes:
      - ./html/products.html:/usr/share/nginx/html/index.html:ro
    networks:
      - elk-network
    restart: unless-stopped

  payment-backend:
    image: nginx:1.25-alpine
    container_name: payment-service
    volumes:
      - ./html/payment.html:/usr/share/nginx/html/index.html:ro
    networks:
      - elk-network
    restart: unless-stopped

networks:
  elk-network:
    external: true
