version: '3.8'

networks:
  elk-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  es-data:
    driver: local

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elk-elasticsearch
    environment:
      - node.name=es-node-1
      - cluster.name=elk-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q cluster_name"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: elk-logstash
    volumes:
      - ../config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: elk-kibana
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q available"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  nginx-lb:
    image: nginx:1.25-alpine
    container_name: nginx-lb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../html:/usr/share/nginx/html:ro
      - ../logs/nginx:/var/log/nginx
    ports:
      - "80:80"
    networks:
      - elk-network
    restart: unless-stopped

  app-service:
    build:
      context: ./app
      dockerfile: ./Dockerfile
    container_name: app-service
    volumes:
      - ../logs/app:/var/log/app
    ports:
      - "5000:5000"
    networks:
      - elk-network
    restart: unless-stopped

  ssh-simulator:
    image: ubuntu:22.04
    container_name: ssh-simulator
    volumes:
      - ./generate_ssh_logs.sh:/generate_ssh_logs.sh:ro
      - ../logs/ssh:/var/log/ssh
    entrypoint: ["/bin/bash", "-c", "apt-get update -qq && apt-get install -y -qq python3 curl && chmod +x /generate_ssh_logs.sh && /generate_ssh_logs.sh 20 && while sleep 30; do /generate_ssh_logs.sh 5; done"]
    networks:
      - elk-network
    restart: unless-stopped

  syslog-simulator:
    image: ubuntu:22.04
    container_name: syslog-simulator
    volumes:
      - ./generate_syslog.sh:/generate_syslog.sh:ro
      - ../logs/syslog:/var/log/syslog
    entrypoint: ["/bin/bash", "-c", "apt-get update -qq && apt-get install -y -qq python3 curl && chmod +x /generate_syslog.sh && /generate_syslog.sh 50 && while sleep 45; do /generate_syslog.sh 10; done"]
    networks:
      - elk-network
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    volumes:
      - ../config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../logs:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - elk-network
    restart: unless-stopped
