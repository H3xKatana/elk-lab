version: '3.8'

services:
  windows-simulator:
    image: ubuntu:22.04
    container_name: windows-simulator
    volumes:
      - ./generate_windows_events.sh:/generate_events.sh:ro
      - ./winlogbeat.yml:/etc/winlogbeat/winlogbeat.yml:ro
      - ./windows-logs:/var/log/windows
    entrypoint: /bin/bash -c "
      apt-get update && apt-get install -y wine &&
      echo 'Windows Event Simulator Ready' &&
      tail -f /dev/null
      "
    networks:
      - elk-network
    restart: unless-stopped

networks:
  elk-network:
    external: true
