version: '3.8'

networks:
  elk-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  es-data:
    driver: local

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elk-elasticsearch
    environment:
      - node.name=es-node-1
      - cluster.name=elk-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: elk-logstash
    volumes:
      - ../config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: elk-kibana
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  nginx-lb:
    image: nginx:alpine
    container_name: nginx-loadbalancer
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../html:/usr/share/nginx/html:ro
      - ../logs/nginx-logs:/var/log/nginx
    ports:
      - "80:80"
    networks:
      - elk-network
    restart: unless-stopped

  checkout-service:
    image: nginx:1.25-alpine
    container_name: checkout-service
    volumes:
      - ../html/checkout.html:/usr/share/nginx/html/index.html:ro
    networks:
      - elk-network
    restart: unless-stopped

  product-service:
    image: nginx:1.25-alpine
    container_name: product-service
    volumes:
      - ../html/products.html:/usr/share/nginx/html/index.html:ro
    networks:
      - elk-network
    restart: unless-stopped

  payment-service:
    image: nginx:1.25-alpine
    container_name: payment-service
    volumes:
      - ../html/payment.html:/usr/share/nginx/html/index.html:ro
    networks:
      - elk-network
    restart: unless-stopped

  filebeat-nginx:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: elk-filebeat-nginx
    user: root
    volumes:
      - ../config/filebeat-nginx.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../logs/nginx-logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - elk-network
    restart: unless-stopped

  filebeat-windows:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: elk-filebeat-windows
    user: root
    volumes:
      - ../config/filebeat-windows.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../logs/windows-logs:/var/log/windows:ro
    depends_on:
      - logstash
    networks:
      - elk-network
    restart: unless-stopped

  windows-simulator:
    image: ubuntu:22.04
    container_name: windows-simulator
    volumes:
      - ./generate_events.sh:/generate_events.sh:ro
      - ../logs/windows-logs:/var/log/windows
    entrypoint: /bin/bash -c "apt-get update -qq && apt-get install -y -qq curl && chmod +x /generate_events.sh && tail -f /dev/null"
    networks:
      - elk-network
    restart: unless-stopped
